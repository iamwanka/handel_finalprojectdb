{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Editar perfil</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <input type="text" name="nombre" class="form-control" value="{{ nombre }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Teléfono (opcional)</label>
                <input type="tel" name="telefono" class="form-control" value="{{ telefono }}">
            </div>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
            <a href="{{ url_for('content.perfil', id=current_user.id) }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
